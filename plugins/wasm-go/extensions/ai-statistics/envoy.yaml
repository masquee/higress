admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                scheme_header_transformation:
                  scheme_to_overwrite: https
                stat_prefix: ingress_http
                # Output envoy logs to stdout
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          protocol: "%PROTOCOL%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          duration: "%DURATION%"
                          bytes_sent: "%BYTES_SENT%"
                          bytes_received: "%BYTES_RECEIVED%"
                          ai_log: "%FILTER_STATE(wasm.ai_log:PLAIN)%"
                          consumer: "%FILTER_STATE(wasm.consumer:PLAIN)%"
                          model: "%FILTER_STATE(wasm.model:PLAIN)%"
                          input_token: "%FILTER_STATE(wasm.input_token:PLAIN)%"
                          output_token: "%FILTER_STATE(wasm.output_token:PLAIN)%"
                          question: "%FILTER_STATE(wasm.question:PLAIN)%"
                          answer: "%FILTER_STATE(wasm.answer:PLAIN)%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: qwen
                            timeout: 300s
                        - match:
                            prefix: "/"
                          route:
                            cluster: httpbin
                            timeout: 30s
                http_filters:
                  # AI Statistics 插件 - 在 ai-proxy 之前，用于统计和观测
                  - name: ai-statistics
                    typed_config:
                      "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                      type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      value:
                        config:
                          name: ai-statistics
                          vm_config:
                            runtime: envoy.wasm.runtime.v8
                            code:
                              local:
                                filename: /etc/envoy/ai-statistics.wasm
                          configuration:
                            "@type": "type.googleapis.com/google.protobuf.StringValue"
                            value: |
                              {
                                "enable_path_suffixes": ["/v1/chat/completions"],
                                "attributes": [
                                  {
                                    "key": "consumer",
                                    "value_source": "request_header",
                                    "value": "x-mse-consumer",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true
                                  },
                                  {
                                    "key": "model",
                                    "value_source": "request_body",
                                    "value": "model",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true,
                                    "apply_to_span": true
                                  },
                                  {
                                    "key": "question",
                                    "value_source": "request_body",
                                    "value": "messages.@reverse.0.content",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true
                                  },
                                  {
                                    "key": "answer",
                                    "value_source": "response_streaming_body",
                                    "value": "choices.0.delta.content",
                                    "rule": "append",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true
                                  },
                                  {
                                    "key": "input_token",
                                    "value_source": "response_streaming_body",
                                    "value": "usage.prompt_tokens",
                                    "rule": "replace",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true
                                  },
                                  {
                                    "key": "output_token",
                                    "value_source": "response_streaming_body",
                                    "value": "usage.completion_tokens",
                                    "rule": "replace",
                                    "apply_to_log": true,
                                    "as_separate_log_field": true
                                  }
                                ]
                              }

                  # AI Proxy 插件 - 处理与 AI 服务的交互
                  - name: ai-proxy
                    typed_config:
                      "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                      type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      value:
                        config:
                          name: ai-proxy
                          vm_config:
                            runtime: envoy.wasm.runtime.v8
                            code:
                              local:
                                filename: /etc/envoy/ai-proxy.wasm
                          configuration:
                            "@type": "type.googleapis.com/google.protobuf.StringValue"
                            value: |
                              {
                                "provider": {
                                  "type": "qwen",
                                  "apiTokens": [
                                    "sk-your-qwen-api-token-here"
                                  ],
                                  "qwenEnableCompatible": true,
                                  "modelMapping": {
                                    "gpt-3": "qwen-turbo",
                                    "gpt-35-turbo": "qwen-plus",
                                    "gpt-4": "qwen-max",
                                    "*": "qwen-turbo"
                                  }
                                }
                              }

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: httpbin
      connect_timeout: 30s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: httpbin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: httpbin
                      port_value: 80

    - name: qwen
      connect_timeout: 30s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          "sni": "dashscope.aliyuncs.com"
