admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                scheme_header_transformation:
                  scheme_to_overwrite: https
                stat_prefix: ingress_http
                # Output envoy logs to stdout
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                # Modify as required
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: [ "*" ]
                      routes:
                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            cluster: qwen
                            timeout: 300s
                        - match:
                            prefix: "/"
                          route:
                            cluster: httpbin
                            timeout: 300s
                http_filters:
                  # AI Token RateLimit 插件配置
                  # 使用 Qwen AI 服务（通义千问）作为上游服务，返回真实的 token usage 信息
                  - name: ai-token-ratelimit
                    typed_config:
                      "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                      type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      value:
                        config:
                          name: ai-token-ratelimit
                          vm_config:
                            runtime: envoy.wasm.runtime.v8
                            code:
                              local:
                                filename: /etc/envoy/plugin.wasm
                          configuration:
                            "@type": "type.googleapis.com/google.protobuf.StringValue"
                            value: |
                              {
                                "rule_name": "test_limit_by_param_apikey",
                                "rule_items": [
                                  {
                                    "limit_by_param": "apikey",
                                    "limit_keys": [
                                      {
                                        "key": "test-key-1",
                                        "token_per_minute": 50
                                      },
                                      {
                                        "key": "test-key-2",
                                        "token_per_minute": 100
                                      }
                                    ]
                                  }
                                ],
                                "redis": {
                                  "service_name": "redis",
                                  "service_port": 6379
                                },
                                "rejected_code": 429,
                                "rejected_msg": "Too many tokens consumed. Please try again later."
                              }
                  # AI Proxy 插件配置
                  # 处理与 Qwen API 的交互，包括认证和协议转换
                  - name: ai-proxy
                    typed_config:
                      "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                      type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      value:
                        config:
                          name: ai-proxy
                          vm_config:
                            runtime: envoy.wasm.runtime.v8
                            code:
                              local:
                                filename: /etc/envoy/ai-proxy.wasm
                          configuration:
                            "@type": "type.googleapis.com/google.protobuf.StringValue"
                            value: |
                              {
                                "activeProviderId": "qwen",
                                "providers": [
                                  {
                                    "id": "qwen",
                                    "type": "qwen",
                                    "domain": "dashscope.aliyuncs.com",
                                    "apiTokens": [
                                      "<YOUR_QWEN_API_TOKEN>"
                                    ],
                                    "timeout": 1200000,
                                    "qwenEnableCompatible": true,
                                    "modelMapping": {
                                      "gpt-3": "qwen-turbo",
                                      "gpt-35-turbo": "qwen-plus",
                                      "gpt-4-turbo": "qwen-max",
                                      "gpt-4-*": "qwen-max",
                                      "qwen-turbo": "qwen-turbo",
                                      "*": "qwen-turbo"
                                    }
                                  }
                                ]
                              }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: httpbin
      connect_timeout: 30s
      type: LOGICAL_DNS
      # Comment out the following line to test on v6 networks
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: httpbin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: httpbin
                      port_value: 80
    - name: qwen
      connect_timeout: 30s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          "sni": "dashscope.aliyuncs.com"
    - name: outbound|6379||redis
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: outbound|6379||redis
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: redis
                      port_value: 6379
